<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Ngăn zoom màn hình khi bấm đúp trên điện thoại để trải nghiệm game mượt hơn -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sentence Scramble | Ôn thi Tiếng Anh 6</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <!-- Thư viện hiệu ứng pháo hoa -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @font-face {
      font-family: 'UTM Avo';
      src: url('fonts/utm-avo.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'UTM Avo', Arial, sans-serif;
      margin: 0;
      background-color: #f0e2cd;
      padding-top: 20px; /* Giảm padding vì không còn header */
      padding-bottom: 130px; /* Chừa không gian cho thanh toolbar bên dưới */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #fffaf2;
      margin: 0 auto;
      padding: 20px;
      width: 95%;
      max-width: 1200px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      border-radius: 12px;
      text-align: center;
      border: 2px solid #e6ccb2;
    }

    .title-header {
      font-size: clamp(24px, 4vw, 32px);
      color: #8b5e3c;
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* Khu vực thả từ và ngân hàng từ */
    #drop-area, #word-bank {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 15px auto;
      min-height: 100px;
      padding: 15px;
      width: 100%;
      border: 2px dashed #c9a77b;
      border-radius: 10px;
      background-color: #fefaf3;
      gap: 10px;
    }

    #drop-area {
      border: 2px solid #8b5e3c;
      background-color: #fff;
    }

    .word {
      background: #ffffff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: clamp(20px, 3.5vw, 32px); /* Tự động thu phóng theo màn hình */
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .word:hover { 
      background: #f1f1f1; 
      transform: translateY(-2px);
    }
    
    .word:active {
      transform: translateY(2px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .word.used { 
      background: #e0e0e0; 
      color: #a0a0a0; 
      border-color: #ccc;
      pointer-events: none; 
      box-shadow: none;
    }

    #result {
      font-size: clamp(20px, 3vw, 24px);
      font-weight: bold;
      margin-top: 20px;
      min-height: 30px;
    }

    .score-summary {
      margin-top: 15px;
      font-size: clamp(18px, 2.5vw, 22px);
      color: #333;
    }

    /* Thanh công cụ cố định bên dưới (Bottom Toolbar) */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #f3dbc1;
      border-top: 3px solid #d4bfa6;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 15px 10px;
      z-index: 1000;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }

    .footer-section {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .footer-label {
      font-weight: bold;
      color: #555;
      font-size: 16px;
    }

    #timer, #current-question, #total-question {
      font-weight: bold;
      font-size: 18px;
      color: #2c3e50;
    }

    .footer-bar button {
      padding: 12px 20px;
      background-color: #ffffff;
      color: #8b5e3c;
      border: 2px solid #c9a77b;
      border-radius: 8px;
      font-size: clamp(14px, 2vw, 16px);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .footer-bar button:hover {
      background-color: #e6ccb2;
    }
    
    .footer-bar button:active {
      transform: scale(0.95);
    }

    .footer-bar button.btn-check {
      background-color: #8b5e3c;
      color: #fff;
      border-color: #5c3a21;
    }
    .footer-bar button.btn-check:hover {
      background-color: #724c30;
    }

    .btn-speed-active {
      background-color: #ffcc80 !important;
      color: #333 !important;
      border-color: #e65100 !important;
    }

    /* Popup dịch nghĩa (Chuột phải hoặc giữ lâu trên điện thoại) */
    #trans-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #ffffff;
      border: 4px solid #c9a77b;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
      z-index: 10001;
      text-align: center;
      width: 90%;
      max-width: 600px;
      animation: fadeIn 0.3s ease;
      cursor: pointer;
    }

    #close-popup {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 32px;
      font-weight: bold;
      color: #c9a77b;
      cursor: pointer;
    }

    #trans-text {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: bold;
      color: #2c3e50;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -55%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    /* Tùy chỉnh nhỏ cho màn hình điện thoại (Dưới 600px) */
    @media (max-width: 600px) {
      .footer-bar { padding: 10px 5px; gap: 8px; }
      .footer-bar button { padding: 10px 12px; }
      .footer-section { width: 100%; justify-content: space-evenly; }
      .hide-on-mobile { display: none; }
    }
  
    /* Nút Trang chủ */
    .shared-home-button {
      position: fixed;
      right: 20px;
      top: 15px;
      z-index: 1001;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border: 2px solid #8b5e3c;
      border-radius: 999px;
      background: #ffd765;
      color: #14213d;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 3px 4px 0 #8b5e3c;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .shared-home-button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 6px 0 #8b5e3c;
    }

  </style>
</head>
<body>
  <a class="shared-home-button" href="index.html" aria-label="Quay về trang chủ">⌂ <span>Trang chủ</span></a>

  <div class="container">
    <div class="title-header">Scramble Sentences</div>
    <div id="drop-area" oncontextmenu="showTranslation(event)"></div>
    <div id="word-bank" oncontextmenu="playFullSentence(event)"></div>
    <div id="result"></div>
    <div class="score-summary" id="summary"></div>
  </div>

  <div id="trans-popup" onclick="this.style.display='none'">
    <span id="close-popup">&times;</span>
    <h3 style="margin-top:0; color:#8b5e3c;">Nghĩa tiếng Việt</h3>
    <div id="trans-text"></div>
  </div>

  <!-- Thanh công cụ điều hướng bên dưới -->
  <div class="footer-bar">
    <div class="footer-section">
      <span class="footer-label">Câu:</span>
      <span id="current-question">1</span> / <span id="total-question">10</span>
      <span style="margin: 0 10px; color: #ccc;">|</span>
      <span class="footer-label">⏱️</span> <span id="timer">0</span>s
    </div>

    <div class="footer-section">
      <button id="speed-btn" onclick="toggleSpeed()">Tốc độ: 1x</button>
      <button onclick="undo()">Hoàn tác</button>
      <button onclick="showHint()">Gợi ý</button>
      <button onclick="restart()">Chơi lại</button>
      <button class="btn-check" onclick="checkOrNext()" id="main-action-btn">Kiểm tra</button>
    </div>
  </div>

function shuffle(array) {
  return array.map(x => ({ val: x, sort: Math.random() }))
              .sort((a, b) => a.sort - b.sort)
              .map(x => x.val);
}

let sentences = shuffle([...originalSentences]);
let currentIndex = 0;
let correctWords = [];
let history = [];
let correctCount = 0;
let totalTime = 0;
let timer = 0;
let interval = null;
let popupTimeout = null;
let currentPlaybackRate = 1;
let isChecked = false; // Biến cờ để kiểm soát nút Check / Next

function toggleSpeed() {
    const btn = document.getElementById("speed-btn");
    if (currentPlaybackRate === 1) {
        currentPlaybackRate = 0.75;
        btn.classList.add("btn-speed-active");
    } else if (currentPlaybackRate === 0.75) {
        currentPlaybackRate = 0.5;
        btn.classList.add("btn-speed-active");
    } else {
        currentPlaybackRate = 1;
        btn.classList.remove("btn-speed-active");
    }
    btn.textContent = `Tốc độ: ${currentPlaybackRate}x`;
}

function pronounce(word) {
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  utterance.rate = currentPlaybackRate;
  const voices = speechSynthesis.getVoices();
  utterance.voice = voices.find(v => v.lang === "en-US" && v.name.includes("Google")) || voices[0];
  speechSynthesis.speak(utterance);
}

function playSentenceAudio(index) {
  const sentence = sentences[index];
  if (!sentence) return;
  const audioSrc = sentence.audio || `sounds/q${sentence.id}.mp3`;
  const audio = new Audio(audioSrc);
  audio.playbackRate = currentPlaybackRate;
  
  audio.play().catch(e => {
    // Fallback sang TTS neu khong tim thay file audio offline
    try {
      const utterance = new SpeechSynthesisUtterance(sentence.text);
      utterance.lang = "en-US";
      utterance.rate = currentPlaybackRate;
      speechSynthesis.speak(utterance);
    } catch(err) {
      console.log("Khong the phat am thanh:", err);
    }
  });
}

function showTranslation(event) {
    event.preventDefault();
    const popup = document.getElementById("trans-popup");
    const textEl = document.getElementById("trans-text");
    textEl.textContent = sentences[currentIndex].vi;
    popup.style.display = "block";
    if (popupTimeout) clearTimeout(popupTimeout);
    popupTimeout = setTimeout(() => { popup.style.display = "none"; }, 4500);
}

function playFullSentence(event) {
    event.preventDefault();
    playSentenceAudio(currentIndex);
}

function loadSentence(index) {
  clearInterval(interval);
  timer = 0;
  isChecked = false;
  
  const mainBtn = document.getElementById("main-action-btn");
  mainBtn.textContent = "Kiểm tra";
  mainBtn.style.backgroundColor = "#8b5e3c";

  document.getElementById("timer").textContent = timer;
  interval = setInterval(() => {
    timer++;
    document.getElementById("timer").textContent = timer;
  }, 1000);

  document.getElementById("result").textContent = "";
  document.getElementById("summary").textContent = "";
  document.getElementById("current-question").textContent = index + 1;
  document.getElementById("total-question").textContent = sentences.length;

  const sentence = sentences[index];
  // Tách dấu câu để ghép chuẩn hơn
  correctWords = sentence.text.replace(/([.?!])/g, " $1").split(/\s+/).filter(w => w !== "");
  const shuffled = shuffle(correctWords);

  history = [];
  const wordBank = document.getElementById("word-bank");
  wordBank.innerHTML = "";
  
  shuffled.forEach(word => {
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = word;
    span.onclick = () => {
      if(!isChecked) {
        pronounce(word);
        selectWord(span);
      }
    };
    wordBank.appendChild(span);
  });
  document.getElementById("drop-area").innerHTML = "";
}

function selectWord(span) {
  const text = span.textContent;
  span.classList.add("used");
  const newSpan = document.createElement("span");
  newSpan.className = "word";
  newSpan.textContent = text;
  newSpan.onclick = () => {
    if(!isChecked) {
      newSpan.remove();
      span.classList.remove("used");
      const histIndex = history.findIndex(h => h.span === newSpan);
      if(histIndex > -1) history.splice(histIndex, 1);
    }
  };
  document.getElementById("drop-area").appendChild(newSpan);
  history.push({ span: newSpan, source: span });
}

function undo() {
  if (isChecked) return;
  const last = history.pop();
  if (last) {
    last.span.remove();
    last.source.classList.remove("used");
  }
}

function restart() { loadSentence(currentIndex); }

function checkOrNext() {
  if (!isChecked) {
    checkSentence();
  } else {
    nextSentence();
  }
}

function checkSentence() {
  const dropWords = Array.from(document.getElementById("drop-area").children).map(el => el.textContent);
  const result = dropWords.join(" ") === correctWords.join(" ");
  
  isChecked = true;
  const mainBtn = document.getElementById("main-action-btn");
  mainBtn.textContent = "Câu tiếp theo ➔";
  mainBtn.style.backgroundColor = "#27ae60";

  if (result) {
    document.getElementById("result").innerHTML = "✅ Chính xác!";
    document.getElementById("result").style.color = "#27ae60";
    clearInterval(interval);
    totalTime += timer;
    correctCount++;

    confetti({
      particleCount: 150,
      spread: 70,
      origin: { y: 0.6 },
      colors: ['#2ecc71', '#f1c40f', '#3498db', '#e74c3c']
    });

    playSentenceAudio(currentIndex);
  } else {
    document.getElementById("result").innerHTML = `❌ Chưa chính xác!<br><span style="color:#27ae60; font-size:0.9em; margin-top:8px; display:block;">✔ Đáp án: ${correctWords.join(" ")}</span>`;
    document.getElementById("result").style.color = "#e74c3c";
    playSentenceAudio(currentIndex); 
  }
}

function showHint() {
  if (isChecked) return;
  const dropWords = Array.from(document.getElementById("drop-area").children).map(el => el.textContent);
  const nextWord = correctWords[dropWords.length];
  if (nextWord) { 
    // Gợi ý nhẹ nhàng ngay trên khu vực kết quả thay vì dùng hàm alert gây gián đoạn
    document.getElementById("result").innerHTML = `<span style="color:#e67e22">💡 Gợi ý từ tiếp theo: <b>${nextWord}</b></span>`;
  }
}

function nextSentence() {
  if (currentIndex < sentences.length - 1) {
    currentIndex++;
    loadSentence(currentIndex);
  } else {
    clearInterval(interval);
    const avgTime = (correctCount > 0) ? (totalTime / correctCount).toFixed(2) : 0;
    document.getElementById("result").innerHTML = "";
    document.getElementById("drop-area").innerHTML = "";
    document.getElementById("word-bank").innerHTML = "";
    document.getElementById("main-action-btn").style.display = "none";
    document.getElementById("summary").innerHTML = `<br>🎯 <b>HOÀN THÀNH BÀI TẬP!</b><br><br>✅ Số câu đúng: ${correctCount} / ${sentences.length}<br>⏱️ Thời gian trung bình: ${avgTime} giây/câu`;
  }
}

// Khởi chạy câu đầu tiên
loadSentence(currentIndex);

// Bắt sự kiện phím tắt cho bút trình chiếu Logitech R800
window.addEventListener('keydown', function(event) {
  if(['PageUp', 'PageDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
    event.preventDefault();
  }

  switch(event.key) {
    case 'PageDown':
    case 'ArrowRight':
      checkOrNext(); 
      break;
      
    case 'PageUp':
    case 'ArrowLeft':
      undo(); 
      break;
      
    case 'b':
    case '.':
      showHint(); 
      break;

    case 'Escape':
      restart(); 
      break;
  }
});
</script>
