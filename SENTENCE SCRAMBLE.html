<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sentence Scramble | Luyện sắp xếp câu Tiếng Anh 6</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Thư viện hiệu ứng pháo hoa -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background-color: #f0e2cd;
      padding-top: 15px;
      padding-bottom: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #2c3e50;
    }

    /* Thanh điều hướng trên cùng */
    .top-nav {
      width: 95%;
      max-width: 1200px;
      margin: 0 auto 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #8b5e3c;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: background 0.2s, transform 0.2s;
    }
    .home-link:hover {
      background: #704729;
      transform: translateY(-1px);
    }

    /* Bộ lọc chủ đề */
    .topic-selector-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fffaf2;
      border: 2px solid #e6ccb2;
      border-radius: 8px;
      padding: 4px 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .topic-selector-wrapper label {
      font-weight: 700;
      font-size: 13px;
      color: #8b5e3c;
      white-space: nowrap;
    }

    .topic-select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #c9a77b;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: #2c3e50;
      outline: none;
      cursor: pointer;
    }

    .container {
      background: #fffaf2;
      margin: 0 auto;
      padding: 24px 20px 20px;
      width: 95%;
      max-width: 1200px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      border-radius: 14px;
      text-align: center;
      border: 2px solid #e6ccb2;
      position: relative;
    }

    .title-header {
      font-size: clamp(24px, 4vw, 32px);
      color: #8b5e3c;
      margin-top: 0;
      margin-bottom: 8px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .subtitle-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      background: #edd5bd;
      color: #6d4527;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    /* Nút hỗ trợ nhanh: Nghe & Dịch */
    .quick-tools {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn-quick {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #c9a77b;
      background: #ffffff;
      color: #8b5e3c;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      transition: all 0.2s;
    }
    .btn-quick:hover {
      background: #e6ccb2;
      transform: translateY(-1px);
    }
    .btn-quick:active {
      transform: scale(0.96);
    }

    /* Khu vực thả từ và ngân hàng từ */
    #drop-area, #word-bank {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 12px auto;
      min-height: 105px;
      padding: 16px;
      width: 100%;
      border: 2px dashed #c9a77b;
      border-radius: 12px;
      background-color: #fefaf3;
      gap: 10px;
      transition: border-color 0.2s;
    }

    #drop-area {
      border: 2px solid #8b5e3c;
      background-color: #fff;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
    }

    .drop-empty-hint {
      color: #a08468;
      font-style: italic;
      font-size: 16px;
      pointer-events: none;
      user-select: none;
    }

    .word {
      background: #ffffff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: clamp(20px, 3.5vw, 30px);
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .word:hover { 
      background: #f1f1f1; 
      transform: translateY(-2px);
    }
    
    .word:active {
      transform: translateY(2px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .word.used { 
      background: #e0e0e0; 
      color: #a0a0a0; 
      border-color: #ccc;
      pointer-events: none; 
      box-shadow: none;
    }

    #result {
      font-size: clamp(20px, 3vw, 24px);
      font-weight: bold;
      margin-top: 18px;
      min-height: 36px;
      line-height: 1.5;
    }

    .score-summary {
      margin-top: 20px;
      font-size: clamp(18px, 2.5vw, 22px);
      color: #333;
      line-height: 1.6;
    }

    /* Thanh công cụ cố định bên dưới (Bottom Toolbar) */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #f3dbc1;
      border-top: 3px solid #d4bfa6;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      z-index: 1000;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
    }

    .footer-section {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .footer-label {
      font-weight: bold;
      color: #555;
      font-size: 15px;
    }

    #timer, #current-question, #total-question {
      font-weight: bold;
      font-size: 18px;
      color: #2c3e50;
    }

    .footer-bar button {
      padding: 11px 18px;
      background-color: #ffffff;
      color: #8b5e3c;
      border: 2px solid #c9a77b;
      border-radius: 8px;
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .footer-bar button:hover {
      background-color: #e6ccb2;
    }
    
    .footer-bar button:active {
      transform: scale(0.95);
    }

    .footer-bar button.btn-check {
      background-color: #8b5e3c;
      color: #fff;
      border-color: #5c3a21;
    }
    .footer-bar button.btn-check:hover {
      background-color: #724c30;
    }

    .btn-speed-active {
      background-color: #ffcc80 !important;
      color: #333 !important;
      border-color: #e65100 !important;
    }

    /* Popup dịch nghĩa */
    #trans-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #ffffff;
      border: 4px solid #c9a77b;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
      z-index: 10001;
      text-align: center;
      width: 90%;
      max-width: 620px;
      animation: fadeIn 0.25s ease;
      cursor: pointer;
    }

    #close-popup {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 32px;
      font-weight: bold;
      color: #c9a77b;
      cursor: pointer;
    }

    #trans-source {
      font-size: 14px;
      color: #8b5e3c;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #trans-text {
      font-size: clamp(20px, 3.8vw, 28px);
      font-weight: bold;
      color: #2c3e50;
      line-height: 1.45;
    }

    #trans-en {
      margin-top: 12px;
      font-size: clamp(16px, 2.8vw, 20px);
      color: #64748b;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -55%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    @media (max-width: 768px) {
      .top-nav { justify-content: center; }
      .topic-selector-wrapper { width: 100%; justify-content: center; }
      .topic-select { max-width: 280px; }
    }

    @media (max-width: 600px) {
      .footer-bar { padding: 8px 4px; gap: 6px; }
      .footer-bar button { padding: 8px 10px; font-size: 13px; }
      .footer-section { width: 100%; justify-content: space-evenly; }
      .hide-on-mobile { display: none; }
    }
  </style>
</head>
<body>

  <!-- Thanh điều hướng và chọn bộ câu hỏi -->
  <header class="top-nav">
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <a href="index.html" class="home-link">🏠 Trang chủ</a>
      <a href="VOCABULARY_PRACTICE_PRO.html" class="home-link" style="background:#0284c7;">📚 Từ vựng</a>
      <a href="GRAMMAR_PRACTICE_PRO.html" class="home-link" style="background:#2563eb;">📝 Ngữ pháp</a>
      <a href="PRONUNCIATION_PRACTICE_PRO.html" class="home-link" style="background:#7c3aed;">🗣️ Phát âm</a>
      <a href="DE%20THI%20GK1%20LOP%206.html" class="home-link" style="background:#ea580c;">📋 Đề thi GK1</a>
    </div>
    
    <div class="topic-selector-wrapper">
      <label for="topic-select">📚 Chọn phần:</label>
      <select id="topic-select" class="topic-select" onchange="changeTopic(this.value)">
        <option value="p1" selected>⭐ Phần 1 (Câu 1 - 22)</option>
        <option value="p2">📝 Phần 2 (Câu 23 - 44)</option>
        <option value="p3">💡 Phần 3 (Câu 45 - 66)</option>
        <option value="random_10">🎲 Thử thách ngẫu nhiên 10 câu</option>
        <option value="all">🌟 Tất cả các câu (66 câu)</option>
      </select>
    </div>
  </header>

  <div class="container">
    <div class="title-header">🧩 Sentence Scramble</div>
    <div class="subtitle-badge" id="category-badge">Phần 1 (Câu 1 - 22)</div>

    <div class="quick-tools">
      <button class="btn-quick" onclick="playSentenceAudio(currentIndex)" title="Nghe phát âm chuẩn cả câu từ file MP3">
        🔊 Nghe câu
      </button>
      <button class="btn-quick" onclick="showTranslation(event)" title="Xem bản dịch nghĩa tiếng Việt chi tiết">
        🇻🇳 Dịch nghĩa
      </button>
    </div>

    <!-- Khu vực thả từ đã chọn -->
    <div id="drop-area" oncontextmenu="showTranslation(event)">
      <div class="drop-empty-hint">Chạm hoặc click từ bên dưới để ghép vào đây...</div>
    </div>

    <!-- Ngân hàng từ xáo trộn -->
    <div id="word-bank" oncontextmenu="playFullSentence(event)"></div>

    <div id="result"></div>
    <div class="score-summary" id="summary"></div>
  </div>

  <!-- Popup hiển thị nghĩa tiếng Việt -->
  <div id="trans-popup" onclick="this.style.display='none'">
    <span id="close-popup">&times;</span>
    <div id="trans-source"></div>
    <h3 style="margin-top:0; color:#8b5e3c; margin-bottom:10px;">Dịch nghĩa Tiếng Việt</h3>
    <div id="trans-text"></div>
    <div id="trans-en"></div>
  </div>

  <!-- Thanh công cụ điều hướng dưới chân màn hình -->
  <div class="footer-bar">
    <div class="footer-section">
      <span class="footer-label">Câu:</span>
      <span id="current-question">1</span> / <span id="total-question">22</span>
      <span style="margin: 0 8px; color: #ccc;">|</span>
      <span class="footer-label">⏱️</span> <span id="timer">0</span>s
    </div>

    <div class="footer-section">
      <button id="speed-btn" onclick="toggleSpeed()">Tốc độ: 1x</button>
      <button onclick="undo()">Hoàn tác</button>
      <button onclick="showHint()">Gợi ý</button>
      <button onclick="restart()">Chơi lại</button>
      <button class="btn-check" onclick="checkOrNext()" id="main-action-btn">Kiểm tra</button>
    </div>
  </div>

<script>
const MASTER_SENTENCES = [
  { "id": 1, "text": "My brother plays the piano very well.", "vi": "Anh trai tôi chơi đàn piano rất giỏi.", "audio": "sounds/q1.mp3" },
  { "id": 2, "text": "Vi and I often do our homework after school.", "vi": "Vy và tôi thường làm bài tập về nhà sau giờ học.", "audio": "sounds/q2.mp3" },
  { "id": 3, "text": "In Maths lessons, we use a calculator to add numbers quickly.", "vi": "Trong các tiết Toán, chúng tôi dùng máy tính cầm tay để cộng các con số nhanh chóng.", "audio": "sounds/q3.mp3" },
  { "id": 4, "text": "At break time, we play games in the school playground.", "vi": "Vào giờ ra chơi, chúng tôi chơi các trò chơi ở sân trường.", "audio": "sounds/q4.mp3" },
  { "id": 5, "text": "We keep food and drinks cold in the fridge.", "vi": "Chúng tôi giữ thức ăn và đồ uống mát lạnh trong tủ lạnh.", "audio": "sounds/q5.mp3" },
  { "id": 6, "text": "My mom is washing the dishes in the sink.", "vi": "Mẹ tôi đang rửa bát trong bồn rửa.", "audio": "sounds/q6.mp3" },
  { "id": 7, "text": "We watch TV in the living room.", "vi": "Chúng tôi xem TV trong phòng khách.", "audio": "sounds/q7.mp3" },
  { "id": 8, "text": "Mina is very creative. She likes drawing and always has new ideas.", "vi": "Mina rất sáng tạo. Bạn ấy thích vẽ và luôn có những ý tưởng mới.", "audio": "sounds/q8.mp3" },
  { "id": 9, "text": "Mai learns things quickly and easily. She's clever.", "vi": "Mai học mọi thứ nhanh chóng và dễ dàng. Bạn ấy rất thông minh.", "audio": "sounds/q9.mp3" },
  { "id": 10, "text": "My best friend has long, curly hair.", "vi": "Bạn thân của tôi có mái tóc dài và xoăn.", "audio": "sounds/q10.mp3" },
  { "id": 11, "text": "We carry things on our shoulders.", "vi": "Chúng ta mang vác đồ đạc trên vai.", "audio": "sounds/q11.mp3" },
  { "id": 12, "text": "Phong is funny. He makes everyone laugh.", "vi": "Phong rất hài hước. Bạn ấy khiến mọi người bật cười.", "audio": "sounds/q12.mp3" },
  { "id": 13, "text": "Duy cycles to school every day.", "vi": "Duy đạp xe đi học mỗi ngày.", "audio": "sounds/q13.mp3" },
  { "id": 14, "text": "My friend has a sister, but she doesn't have a brother.", "vi": "Bạn tôi có một người chị gái, nhưng bạn ấy không có anh trai.", "audio": "sounds/q14.mp3" },
  { "id": 15, "text": "I live near here. Where do you live?", "vi": "Tôi sống ở gần đây. Bạn sống ở đâu?", "audio": "sounds/q15.mp3" },
  { "id": 16, "text": "Do you often travel at weekends?", "vi": "Bạn có thường đi du lịch vào cuối tuần không?", "audio": "sounds/q16.mp3" },
  { "id": 17, "text": "She is never late for school. She always gets up early.", "vi": "Cô ấy không bao giờ đi học muộn. Cô ấy luôn dậy sớm.", "audio": "sounds/q17.mp3" },
  { "id": 18, "text": "Nam's house is small.", "vi": "Nhà của Nam nhỏ.", "audio": "sounds/q18.mp3" },
  { "id": 19, "text": "The lamp is between the bed and the wardrobe.", "vi": "Cây đèn ở giữa giường ngủ và tủ quần áo.", "audio": "sounds/q19.mp3" },
  { "id": 20, "text": "There are two bedrooms in my flat.", "vi": "Có hai phòng ngủ trong căn hộ của tôi.", "audio": "sounds/q20.mp3" },
  { "id": 21, "text": "How about putting a picture on the wall?", "vi": "Hay là chúng ta treo một bức tranh lên tường nhé?", "audio": "sounds/q21.mp3" },
  { "id": 22, "text": "Look! The children are playing football in the playground.", "vi": "Nhìn kìa! Bọn trẻ đang chơi bóng đá trong sân chơi.", "audio": "sounds/q22.mp3" },
  { "id": 23, "text": "I am doing my homework at the moment.", "vi": "Hiện tại tôi đang làm bài tập về nhà.", "audio": "sounds/q23.mp3" },
  { "id": 24, "text": "My sister isn't making a sandwich at present.", "vi": "Lúc này chị tôi không làm bánh mì kẹp.", "audio": "sounds/q24.mp3" },
  { "id": 25, "text": "We are having a picnic tomorrow. Do you want to come?", "vi": "Ngày mai chúng tôi sẽ đi dã ngoại. Bạn có muốn đi cùng không?", "audio": "sounds/q25.mp3" },
  { "id": 26, "text": "She's tall with long black hair.", "vi": "Cô ấy cao với mái tóc đen dài.", "audio": "sounds/q26.mp3" },
  { "id": 27, "text": "Hi, I'm Lan. I live in a townhouse in Hai Phong.", "vi": "Xin chào, tôi là Lan. Tôi sống trong một ngôi nhà phố ở Hải Phòng.", "audio": "sounds/q27.mp3" },
  { "id": 28, "text": "There is a bed next to the window.", "vi": "Có một chiếc giường ở cạnh cửa sổ.", "audio": "sounds/q28.mp3" },
  { "id": 29, "text": "There is a desk next to the bed, and there is a lamp on the desk.", "vi": "Có một chiếc bàn học cạnh giường, và có một chiếc đèn ở trên bàn.", "audio": "sounds/q29.mp3" },
  { "id": 30, "text": "My clothes are in the wardrobe.", "vi": "Quần áo của tôi ở trong tủ quần áo.", "audio": "sounds/q30.mp3" },
  { "id": 31, "text": "At the moment, she is cooking dinner,", "vi": "Lúc này, mẹ đang nấu bữa tối,", "audio": "sounds/q31.mp3" },
  { "id": 32, "text": "and I am helping her.", "vi": "và tôi đang phụ giúp mẹ.", "audio": "sounds/q32.mp3" },
  { "id": 33, "text": "You must not talk loudly or eat in the library.", "vi": "Bạn không được nói to hoặc ăn uống trong thư viện.", "audio": "sounds/q33.mp3" },
  { "id": 34, "text": "You can rent a flat with two bedrooms.", "vi": "Bạn có thể thuê một căn hộ có hai phòng ngủ.", "audio": "sounds/q34.mp3" },
  { "id": 35, "text": "Small children need an adult with them.", "vi": "Trẻ nhỏ cần có người lớn đi cùng.", "audio": "sounds/q35.mp3" },
  { "id": 36, "text": "Linh's new school and her best friend.", "vi": "Ngôi trường mới của Linh và người bạn thân nhất của bạn ấy.", "audio": "sounds/q36.mp3" },
  { "id": 37, "text": "My classroom is next to the library.", "vi": "Lớp học của tôi ở cạnh thư viện.", "audio": "sounds/q37.mp3" },
  { "id": 38, "text": "It's good, but sometimes it's a bit salty.", "vi": "Món ăn ngon, nhưng đôi khi hơi mặn một chút.", "audio": "sounds/q38.mp3" },
  { "id": 39, "text": "Encourages means helps and supports.", "vi": "Encourages có nghĩa là giúp đỡ và hỗ trợ.", "audio": "sounds/q39.mp3" },
  { "id": 40, "text": "She's on the school volleyball team.", "vi": "Cô ấy ở trong đội bóng chuyền của trường.", "audio": "sounds/q40.mp3" },
  { "id": 41, "text": "Linh and Ngoc are making sandwiches.", "vi": "Linh và Ngọc đang làm bánh mì kẹp.", "audio": "sounds/q41.mp3" },
  { "id": 42, "text": "She is tall and slim with long straight black hair and big brown eyes.", "vi": "Bạn ấy cao ráo, mảnh mai với mái tóc đen dài thẳng và đôi mắt nâu to tròn.", "audio": "sounds/q42.mp3" },

function shuffle(array) {
  return array.map(x => ({ val: x, sort: Math.random() }))
              .sort((a, b) => a.sort - b.sort)
              .map(x => x.val);
}

let currentTopicKey = 'p1';
let sentences = [];
let currentIndex = 0;
let correctWords = [];
let history = [];
let correctCount = 0;
let totalTime = 0;
let timer = 0;
let interval = null;
let popupTimeout = null;
let currentPlaybackRate = 1;
let isChecked = false;
let currentAudioObj = null;

// Lọc câu hỏi theo chủ đề (chia 66 câu thành 3 phần cho dễ quản lý)
function filterSentencesByTopic(key) {
  let pool = [];
  if (key === 'p1') {
    pool = MASTER_SENTENCES.slice(0, 22);
  } else if (key === 'p2') {
    pool = MASTER_SENTENCES.slice(22, 44);
  } else if (key === 'p3') {
    pool = MASTER_SENTENCES.slice(44, 66);
  } else if (key === 'random_10') {
    pool = shuffle([...MASTER_SENTENCES]).slice(0, 10);
  } else {
    pool = [...MASTER_SENTENCES];
  }

  // Nếu không phải bộ random_10 thì xáo trộn thứ tự câu trong phần đó
  if (key !== 'random_10') {
    pool = shuffle(pool);
  }
  return pool;
}

// Đổi chủ đề khi người dùng chọn trên dropdown
function changeTopic(key) {
  currentTopicKey = key;
  const selectEl = document.getElementById("topic-select");
  const selectedText = selectEl.options[selectEl.selectedIndex].text;
  document.getElementById("category-badge").textContent = selectedText;

  sentences = filterSentencesByTopic(key);
  currentIndex = 0;
  correctCount = 0;
  totalTime = 0;
  loadSentence(currentIndex);
}

function toggleSpeed() {
  const btn = document.getElementById("speed-btn");
  if (currentPlaybackRate === 1) {
    currentPlaybackRate = 0.75;
    btn.classList.add("btn-speed-active");
  } else if (currentPlaybackRate === 0.75) {
    currentPlaybackRate = 0.5;
    btn.classList.add("btn-speed-active");
  } else {
    currentPlaybackRate = 1;
    btn.classList.remove("btn-speed-active");
  }
  btn.textContent = `Tốc độ: ${currentPlaybackRate}x`;
}

// Phát âm từ đơn khi bấm vào thẻ từ
function pronounce(word) {
  if (!word || word === '.' || word === '?' || word === '!' || word === ',') return;
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = "en-US";
      utterance.rate = currentPlaybackRate;
      const voices = speechSynthesis.getVoices();
      utterance.voice = voices.find(v => v.lang === "en-US" && v.name.includes("Google")) || voices[0];
      speechSynthesis.speak(utterance);
    }
  } catch (e) {
    console.warn("TTS error:", e);
  }
}

// Phát âm toàn bộ câu bằng file MP3 offline chuẩn từ sounds/ hoặc Fallback TTS
function playSentenceAudio(index) {
  if (!sentences || !sentences[index]) return;
  const s = sentences[index];
  
  if (currentAudioObj) {
    currentAudioObj.pause();
    currentAudioObj = null;
  }

  try {
    const audioSrc = s.audio || `sounds/q${s.id}.mp3`;
    currentAudioObj = new Audio(audioSrc);
    currentAudioObj.playbackRate = currentPlaybackRate;
    
    currentAudioObj.play().catch(e => {
      // Fallback sang Web Speech API
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(s.text);
        utterance.lang = "en-US";
        utterance.rate = currentPlaybackRate;
        speechSynthesis.speak(utterance);
      }
    });
  } catch (err) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(s.text);
      utterance.lang = "en-US";
      utterance.rate = currentPlaybackRate;
      speechSynthesis.speak(utterance);
    }
  }
}

function showTranslation(event) {
  if (event) event.preventDefault();
  if (!sentences[currentIndex]) return;
  const s = sentences[currentIndex];

  const popup = document.getElementById("trans-popup");
  document.getElementById("trans-source").textContent = "Tiếng Anh 6 - Câu " + s.id;
  document.getElementById("trans-text").textContent = s.vi;
  document.getElementById("trans-en").textContent = s.text;
  popup.style.display = "block";

  if (popupTimeout) clearTimeout(popupTimeout);
  popupTimeout = setTimeout(() => { popup.style.display = "none"; }, 5000);
}

function playFullSentence(event) {
  if (event) event.preventDefault();
  playSentenceAudio(currentIndex);
}

function loadSentence(index) {
  clearInterval(interval);
  timer = 0;
  isChecked = false;
  
  const mainBtn = document.getElementById("main-action-btn");
  mainBtn.textContent = "Kiểm tra";
  mainBtn.style.backgroundColor = "#8b5e3c";
  mainBtn.style.display = "inline-block";

  document.getElementById("timer").textContent = timer;
  interval = setInterval(() => {
    timer++;
    document.getElementById("timer").textContent = timer;
  }, 1000);

  document.getElementById("result").textContent = "";
  document.getElementById("summary").textContent = "";
  document.getElementById("current-question").textContent = index + 1;
  document.getElementById("total-question").textContent = sentences.length;

  const currentItem = sentences[index];
  
  // Tách từ chuẩn hóa và tách dấu câu cuối (. ? !) thành 1 token riêng
  correctWords = currentItem.text
    .replace(/([.?!])/g, " $1")
    .trim()
    .split(/\s+/)
    .filter(w => w !== "");

  const shuffled = shuffle(correctWords);

  history = [];
  const wordBank = document.getElementById("word-bank");
  wordBank.innerHTML = "";
  
  shuffled.forEach(word => {
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = word;
    span.onclick = () => {
      if (!isChecked) {
        pronounce(word);
        selectWord(span);
      }
    };
    wordBank.appendChild(span);
  });

  const dropArea = document.getElementById("drop-area");
  dropArea.innerHTML = '<div class="drop-empty-hint">Chạm hoặc click từ bên dưới để ghép vào đây...</div>';
}

function selectWord(span) {
  const dropArea = document.getElementById("drop-area");
  const hintEl = dropArea.querySelector(".drop-empty-hint");
  if (hintEl) hintEl.remove();

  const text = span.textContent;
  span.classList.add("used");
  const newSpan = document.createElement("span");
  newSpan.className = "word";
  newSpan.textContent = text;
  newSpan.onclick = () => {
    if (!isChecked) {
      newSpan.remove();
      span.classList.remove("used");
      const histIndex = history.findIndex(h => h.span === newSpan);
      if (histIndex > -1) history.splice(histIndex, 1);
      if (dropArea.children.length === 0) {
        dropArea.innerHTML = '<div class="drop-empty-hint">Chạm hoặc click từ bên dưới để ghép vào đây...</div>';
      }
    }
  };
  dropArea.appendChild(newSpan);
  history.push({ span: newSpan, source: span });
}

function undo() {
  if (isChecked) return;
  const last = history.pop();
  if (last) {
    last.span.remove();
    last.source.classList.remove("used");
  }
  const dropArea = document.getElementById("drop-area");
  if (dropArea.children.length === 0) {
    dropArea.innerHTML = '<div class="drop-empty-hint">Chạm hoặc click từ bên dưới để ghép vào đây...</div>';
  }
}

function restart() { 
  loadSentence(currentIndex); 
}

function checkOrNext() {
  if (!isChecked) {
    checkSentence();
  } else {
    nextSentence();
  }
}

function checkSentence() {
  const dropWords = Array.from(document.getElementById("drop-area").children)
    .filter(el => !el.classList.contains("drop-empty-hint"))
    .map(el => el.textContent);

  if (dropWords.length === 0) {
    document.getElementById("result").innerHTML = '<span style="color:#e67e22">⚠️ Vui lòng chọn các từ để hoàn thiện câu trước khi kiểm tra!</span>';
    return;
  }

  const result = dropWords.join(" ") === correctWords.join(" ");
  
  isChecked = true;
  const mainBtn = document.getElementById("main-action-btn");
  mainBtn.textContent = "Câu tiếp theo ➔";
  mainBtn.style.backgroundColor = "#27ae60";

  if (result) {
    document.getElementById("result").innerHTML = "✅ <b>Chính xác!</b> Giỏi quá!";
    document.getElementById("result").style.color = "#27ae60";
    clearInterval(interval);
    totalTime += timer;
    correctCount++;

    confetti({
      particleCount: 150,
      spread: 70,
      origin: { y: 0.6 },
      colors: ['#2ecc71', '#f1c40f', '#3498db', '#e74c3c']
    });

    playSentenceAudio(currentIndex);
  } else {
    const currentItem = sentences[currentIndex];
    document.getElementById("result").innerHTML = `❌ <b>Chưa chính xác!</b><br>
      <span style="color:#27ae60; font-size:0.95em; margin-top:8px; display:block;">✔ <b>Đáp án chuẩn:</b> ${currentItem.text}</span>
      <span style="color:#8b5e3c; font-size:0.85em; margin-top:4px; display:block;">🇻🇳 <i>Nghĩa: ${currentItem.vi}</i></span>`;
    document.getElementById("result").style.color = "#e74c3c";
    playSentenceAudio(currentIndex); 
  }
}

function showHint() {
  if (isChecked) return;
  const dropWords = Array.from(document.getElementById("drop-area").children)
    .filter(el => !el.classList.contains("drop-empty-hint"))
    .map(el => el.textContent);

  const nextWord = correctWords[dropWords.length];
  if (nextWord) { 
    document.getElementById("result").innerHTML = `<span style="color:#e67e22">💡 Gợi ý từ tiếp theo: <b>${nextWord}</b></span>`;
  } else {
    document.getElementById("result").innerHTML = `<span style="color:#27ae60">💡 Bạn đã ghép đủ từ, hãy bấm <b>Kiểm tra</b>!</span>`;
  }
}

function nextSentence() {
  if (currentIndex < sentences.length - 1) {
    currentIndex++;
    loadSentence(currentIndex);
  } else {
    clearInterval(interval);
    const avgTime = (correctCount > 0) ? (totalTime / correctCount).toFixed(1) : 0;
    document.getElementById("result").innerHTML = "";
    document.getElementById("drop-area").innerHTML = "";
    document.getElementById("word-bank").innerHTML = "";
    document.getElementById("main-action-btn").style.display = "none";
    document.getElementById("summary").innerHTML = `
      <div style="background:#fff; border:3px solid #c9a77b; border-radius:16px; padding:24px; max-width:600px; margin:0 auto;">
        🎯 <b style="font-size:1.3em; color:#8b5e3c;">HOÀN THÀNH BỘ BÀI TẬP!</b><br><br>
        ✅ <b>Số câu đúng:</b> ${correctCount} / ${sentences.length}<br>
        ⏱️ <b>Thời gian trung bình:</b> ${avgTime} giây/câu<br><br>
        <button onclick="changeTopic(currentTopicKey)" style="padding:10px 24px; background:#8b5e3c; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;">🔄 Luyện tập lại bộ này</button>
      </div>`;
  }
}

// Khởi chạy bộ bài tập mặc định ban đầu
changeTopic('p1');

// Bắt sự kiện phím bấm máy tính & bút trình chiếu Logitech R800
window.addEventListener('keydown', function(event) {
  if (['PageUp', 'PageDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
    event.preventDefault();
  }

  switch(event.key) {
    case 'PageDown':
    case 'ArrowRight':
      checkOrNext(); 
      break;
      
    case 'PageUp':
    case 'ArrowLeft':
      undo(); 
      break;
      
    case 'b':
    case '.':
      showHint(); 
      break;

    case 'Escape':
      restart(); 
      break;

    case 'v':
    case 'V':
      playSentenceAudio(currentIndex);
      break;

    case 's':
    case 'S':
      toggleSpeed();
      break;
  }
});
</script>
